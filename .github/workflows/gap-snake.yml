name: Generate Gap Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow

      - name: Fetch contribution data
        run: curl -s "https://github.com/users/${{ github.repository_owner }}/contributions" -o contrib.html

      - name: Render gap-snake GIF
        run: python scripts/make_gap_snake.py contrib.html assets/gap-snake.gif

      - name: Commit & Push
        run: |
          rm -f contrib.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gap-snake.gif
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update gap snake" && git push)
